<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coin Olasılık Tarayıcı</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#6b7280;--card:#f4f5f7;--line:#e2e4e8;--up:#0a8f4e;--dn:#d33;--ac:#2563eb}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--fg:#e8eaed;--mut:#9aa0a6;--card:#1b1f25;--line:#2a2f37;--up:#3ddc84;--dn:#ff6b6b;--ac:#6ea0ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 system-ui,sans-serif;padding:12px;padding-top:max(12px,env(safe-area-inset-top))}
h1{font-size:18px;margin:0 0 4px}.mut{color:var(--mut);font-size:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0;font-size:13px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:700px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--card);cursor:pointer;font-size:12px}
th:nth-child(2),td:nth-child(2){text-align:left}
a{color:var(--ac);text-decoration:none;font-weight:600}.up{color:var(--up)}.dn{color:var(--dn)}
.s{display:inline-block;min-width:48px;padding:2px 6px;border-radius:6px;background:var(--card);font-weight:700}
</style></head><body>
<h1>Coin Olasılık Tarayıcı</h1><div class="mut" id="upd">Yükleniyor…</div>
<div class="box" id="met"></div>
<div class="wrap"><table><thead><tr id="h"></tr></thead><tbody id="b"></tbody></table></div>
<p class="mut">Olasılık, geçmiş veriden öğrenen bir modelin tahminidir; kesinlik değildir. Yatırım tavsiyesi değildir.</p>
<script>
const C=[["#",null],["Coin","symbol"],["Olasılık","prob"],["Fiyat","price"],["1G","r1"],["5G","r5"],["1A","r30"],["3A","r90"],["6A","r180"],["1Y","r365"],["ATH'den","ath_dd"],["RSI","rsi"],["ATR%","atr"]];
let D=[],key="prob",dir=-1;
const f=(v,d=2)=>v==null?"-":v.toLocaleString("tr-TR",{maximumFractionDigits:d});
const pc=v=>v==null?"-":`<span class="${v>=0?"up":"dn"}">${v>0?"+":""}${f(v,1)}%</span>`;
function render(){h.innerHTML=C.map(([t,k])=>`<th ${k?`data-k="${k}"`:""}>${t}${k===key?(dir<0?" ▼":" ▲"):""}</th>`).join("");
 h.querySelectorAll("th[data-k]").forEach(th=>th.onclick=()=>{const k=th.dataset.k;dir=key===k?-dir:-1;key=k;render()});
 const L=[...D].sort((a,b)=>((a[key]??-1e18)>(b[key]??-1e18)?1:-1)*dir);
 b.innerHTML=L.map((x,i)=>`<tr><td>${i+1}</td><td><a target="_blank" rel="noopener" href="https://www.tradingview.com/chart/?symbol=BINANCE:${x.symbol}USDT">${x.symbol}</a></td><td><span class="s">%${f(x.prob,1)}</span></td><td>${f(x.price,6)}</td><td>${pc(x.r1)}</td><td>${pc(x.r5)}</td><td>${pc(x.r30)}</td><td>${pc(x.r90)}</td><td>${pc(x.r180)}</td><td>${pc(x.r365)}</td><td>${pc(x.ath_dd)}</td><td>${f(x.rsi,0)}</td><td>${f(x.atr)}</td></tr>`).join("")}
fetch("data.json?"+Date.now()).then(r=>r.json()).then(j=>{D=j.items;const m=j.metrics;
 upd.textContent=j.updated?`Son güncelleme: ${new Date(j.updated).toLocaleString("tr-TR")} · ${D.length} coin · Hedef: ${j.days} günde +%${j.target}`:"Henüz veri yok. Actions'tan scan'i çalıştır.";
 if(m)met.innerHTML=`<b>Model son 90 günde test edildi:</b><br>Rastgele bir coinin hedefe ulaşma oranı: <b>%${f(m.base_rate)}</b><br>Modelin en yüksek %5 tahmininde gerçek isabet: <b>%${f(m.top5_hit)}</b><br>AUC: <b>${f(m.auc,3)}</b> (0,5 = şans, 0,6+ = zayıf ama gerçek sinyal)<br><span class="mut">Üstteki iki oran birbirinden belirgin farklı değilse model işe yaramıyor demektir.</span>`;
 render()}).catch(()=>upd.textContent="Veri okunamadı");
</script></body></html>
